<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helper bağlantı testi</title>
<style>
  :root { --bg:#f6f7f9; --fg:#14171c; --muted:#5b6470; --ok:#1f8a4c; --bad:#c0392b; --card:#fff; --line:#dde1e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#eef0f3; --muted:#a3abb6; --card:#1d2128; --line:#2c323b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.muted { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .status { font-weight:700; font-size:20px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--muted); }
  code, pre { font:13px/1.4 ui-monospace, Consolas, monospace; word-break:break-all; white-space:pre-wrap; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; margin-right:8px; }
</style>
</head>
<body>
<main>
  <h1>Helper bağlantı testi</h1>
  <p class="muted">Bu sayfa, bu bilgisayardaki sahte helper'a (127.0.0.1) istek atabiliyor mu diye bakar.</p>

  <div class="card">
    <div class="row"><span>Ortam</span><strong id="env"></strong></div>
    <div class="row"><span>Sayfa adresi</span><code id="origin"></code></div>
  </div>

  <div id="results"></div>

  <p>
    <button id="rerun">Tekrar dene</button>
    <button id="copy">Sonuçları kopyala</button>
  </p>
  <div class="card"><pre id="ua"></pre></div>
</main>
<script>
const TARGETS = [
  { name: "HTTP  (http://127.0.0.1:47321)",  base: "http://127.0.0.1:47321" },
  { name: "HTTPS (https://127.0.0.1:47322)", base: "https://127.0.0.1:47322" },
];
const isSeb = /SEB\//.test(navigator.userAgent);
document.getElementById("env").textContent = isSeb ? "Safe Exam Browser" : "Normal tarayıcı";
document.getElementById("origin").textContent = location.origin;
document.getElementById("ua").textContent = "User-Agent: " + navigator.userAgent;

let summary = [];

async function call(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  const started = performance.now();
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal, cache: "no-store" });
    const text = await res.text();
    return { ok: res.ok, status: res.status, ms: Math.round(performance.now() - started), body: text };
  } catch (e) {
    return { ok: false, status: 0, ms: Math.round(performance.now() - started),
             body: e.name === "AbortError" ? "Zaman aşımı (5 sn)" : String(e) };
  } finally { clearTimeout(timer); }
}

async function run() {
  summary = [`Ortam: ${isSeb ? "SEB" : "Tarayıcı"} | Sayfa: ${location.origin} | ${new Date().toISOString()}`];
  const box = document.getElementById("results");
  box.innerHTML = "";
  for (const t of TARGETS) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="row"><span>${t.name}</span><span class="status wait">deneniyor…</span></div><pre></pre>`;
    box.appendChild(card);
    const info = await call(t.base + "/v1/info", { method: "GET" });
    const sign = await call(t.base + "/v1/sign", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ challenge: "test-" + Date.now() }),
    });
    const pass = info.ok && sign.ok;
    const status = card.querySelector(".status");
    status.textContent = pass ? "BAŞARILI" : "BAŞARISIZ";
    status.className = "status " + (pass ? "ok" : "bad");
    card.querySelector("pre").textContent =
      `GET  /v1/info -> ${info.status || "hata"} (${info.ms} ms) ${info.body}\n` +
      `POST /v1/sign -> ${sign.status || "hata"} (${sign.ms} ms) ${sign.body}`;
    summary.push(`${t.name}: ${pass ? "BAŞARILI" : "BAŞARISIZ"} | info=${info.status || info.body} | sign=${sign.status || sign.body}`);
  }
}

document.getElementById("rerun").onclick = run;
document.getElementById("copy").onclick = async () => {
  const text = summary.join("\n") + "\n" + navigator.userAgent;
  try { await navigator.clipboard.writeText(text); alert("Kopyalandı"); }
  catch { prompt("Kopyalayın:", text); }
};
run();
</script>
</body>
</html>
